services:
  web:
    build:
      context: .
      target: development
    env_file:
      - path: .env
        format: raw
    ports:
      - "127.0.0.1:${HTTP_PORT:-4321}:4321"
    volumes:
      - .:/app
      - dependencies:/app/node_modules
    command: ["sh", "-c", "npm ci && npm run dev"]
volumes:
  dependencies:
